# Spring Security is a test dependency for the error-page tests alone (issue #38), but its
# auto-configuration would otherwise protect every other test application in this module, and Tomcat
# is one for the mixed-classpath test alone (issue #41), but the starter yields to it, so every other
# test application would start Tomcat. Both off by default; a higher-precedence property source
# replaces this key rather than adding to it, so a test that wants Security sets
# spring.autoconfigure.exclude back to the Tomcat entry alone, and a test that wants an exclusion of
# its own has to repeat these five entries alongside it.
spring.autoconfigure.exclude=\
  org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,\
  org.springframework.boot.tomcat.autoconfigure.servlet.TomcatServletWebServerAutoConfiguration
