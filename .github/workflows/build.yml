name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Run on both OSes so the auto-select logic and both native paths (epoll on Linux,
    # kqueue on macOS) are actually exercised.
    #
    # NOTE: the job name and these matrix values expand into the required status check
    # contexts named in .github/rulesets/main-required-ci.json ("build (ubuntu-latest)",
    # "build (macos-latest)"). Renaming the job or any matrix value must happen in the
    # same PR as a ruleset update. That ruleset has no bypass actors, so a required check
    # that stops being reported is worse than one that fails: every subsequent PR sits on
    # "Expected — waiting for status" with no in-repo way out, only the web UI.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build
